# PRごとに型チェックとビルドを走らせる。
#
# Vercelのプレビューでもビルドは走るが、失敗に気付くのがデプロイ後になる。
# 型エラーやビルド失敗はマージ前に落としたいので、PR上でも確認する。
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # package-lock.json どおりに入れる。lockがずれていればここで落ちる。
      - name: Install dependencies
        run: npm ci

      # .astro/types.d.ts を含む型チェック。astroコンポーネント側も見る。
      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build
